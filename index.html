<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarbion xususiy maktabi — Robototexnika Dars Rejalari</title>
<meta name="description" content="Tarbion xususiy maktabi — 0–4-sinf robototexnika va IT dasturi bo'yicha dars rejalari bazasi.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Tarbion xususiy maktabi — yorug' tema.
     Asosiy rang maktab peshtoqi va logotipidagi to'q yashildan olingan. */
  --bg: #ffffff;
  --bg-deep: #f3f7f3;
  --panel: #ffffff;
  --panel-2: #eaf1eb;
  --grid-line: rgba(23,96,45,0.045);
  --border: #d9e4da;
  --border-light: #bed0c1;
  --accent: #17602D;        /* brend yashili — logotip va "Tarbion" yozuvidagi to'q yashil */
  --accent-dim: #a3c5ad;    /* och yashil — chegaralar uchun */
  --accent2: #9a6410;       /* ikkilamchi urg'u (yorug' fonda o'qiladigan amber) */
  --accent2-dim: #dcc39a;
  --text: #16261b;
  --text-dim: #4c5d52;
  --text-faint: #7a8b80;
  --red: #c0392b;
  --green: #6AB42D;         /* brendning ikkinchi, ochroq yashili (posterdagi "QABUL") */
  --font-display: 'Big Shoulders Display', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Sans', sans-serif;
  /* Sarlavha balandligi — app.js har safar o'lchab yangilaydi.
     Telefonda chetdan chiqadigan panel shu qiymatdan pastda boshlanadi,
     shunda "burger" tugma ochiq turganda ham bosiladigan bo'lib qoladi. */
  --hdr: 64px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(23,96,45,0.07), transparent),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(154,100,16,0.045), transparent),
    var(--bg-deep);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:14px 24px;
  background:linear-gradient(180deg, var(--panel), var(--bg));
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:50;
}
/* Telefon uchun "burger" tugma — 860px dan keng ekranda ko'rinmaydi */
.nav-toggle{
  display:none; flex:0 0 auto; width:42px; height:42px; padding:0;
  background:var(--bg-deep); border:1px solid var(--border-light); border-radius:9px;
  cursor:pointer; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.nav-toggle span{display:block; width:18px; height:2px; background:var(--accent); border-radius:2px; transition:transform .2s, opacity .2s;}
.nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;}
.nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.brand-wrap{min-width:0;}
.nav-backdrop{display:none;}
.open-nav-btn{display:none;}
/* Maktab emblemasi — kitob ustida o'sayotgan nihol.
   Inline SVG: rangni currentColor orqali temadan oladi, alohida rasm fayli kerak emas. */
.logo-mark{
  width:42px; height:42px; flex:0 0 auto;
  border:2px solid var(--accent);
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); background:#fff;
  position:relative;
  box-shadow:0 2px 10px rgba(23,96,45,0.16);
}
.logo-mark svg{width:26px; height:26px; display:block;}
h1.brand{
  font-family:var(--font-display); font-weight:800; font-size:26px;
  letter-spacing:0.5px; text-transform:uppercase; color:var(--text);
  line-height:1;
}
h1.brand span{color:var(--accent);}
.brand-sub{
  font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;
}
/* HTML tartibi: burger, logo, brend, hisob, qidiruv.
   Kompyuterda ko'rinish tartibi boshqacha (qidiruv o'ngda, hisob eng oxirida),
   shuning uchun order bilan qayta joylashtiriladi. */
.search-wrap{
  order:3; margin-left:auto; position:relative; width:340px; max-width:40vw;
}
.search-wrap input{
  width:100%; background:var(--bg-deep); border:1px solid var(--border-light);
  border-radius:8px; padding:10px 14px 10px 36px; color:var(--text);
  font-family:var(--font-mono); font-size:13px; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(23,96,45,0.14);}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:14px; pointer-events:none;}
.stats-badge{
  order:4;
  font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
  border:1px solid var(--border-light); border-radius:20px; padding:6px 14px;
  white-space:nowrap;
}
.stats-badge b{color:var(--accent2);}
.layout{display:flex; flex:1; min-height:0; min-width:0;}
nav.tree{
  width:340px; flex:0 0 auto;
  border-right:1px solid var(--border);
  background:var(--bg-deep);
  overflow-y:auto;
  padding:16px 10px 40px;
}
nav.tree::-webkit-scrollbar{width:8px;}
nav.tree::-webkit-scrollbar-thumb{background:var(--border-light); border-radius:4px;}
nav.tree::-webkit-scrollbar-track{background:transparent;}
.yil-tabs{display:flex; gap:8px; padding:0 6px 14px;}
.yil-tab{
  flex:1; text-align:center; padding:9px 0; border-radius:7px;
  font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:0.5px;
  border:1px solid var(--border-light); color:var(--text-dim); cursor:pointer;
  transition:all .15s;
}
.yil-tab.active{background:var(--accent); color:var(--bg-deep); border-color:var(--accent);}
.yil-tab:not(.active):hover{border-color:var(--accent-dim); color:var(--text);}
.sinf-block{margin-bottom:4px;}
.sinf-head{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:7px; cursor:pointer;
  font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--text);
  transition:background .15s;
}
.sinf-head:hover{background:var(--panel-2);}
.sinf-head .chevron{
  transition:transform .18s; color:var(--text-faint); font-size:10px; width:10px;
}
.sinf-head.open .chevron{transform:rotate(90deg); color:var(--accent);}
.sinf-count{margin-left:auto; font-size:10px; color:var(--text-faint); background:var(--bg-deep); padding:2px 7px; border-radius:10px;}
.chorak-list{max-height:0; overflow:hidden; transition:max-height .25s ease; padding-left:14px;}
.chorak-list.open{max-height:3000px;}
.chorak-head{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; margin:2px 0; border-radius:6px; cursor:pointer;
  font-size:12px; color:var(--text-dim); border-left:2px solid var(--border-light);
}
.chorak-head:hover{color:var(--text); border-left-color:var(--accent-dim);}
.chorak-head.open{color:var(--accent); border-left-color:var(--accent);}
.chorak-head .chevron{font-size:9px; transition:transform .18s;}
.chorak-head.open .chevron{transform:rotate(90deg);}
.dars-list{max-height:0; overflow:hidden; transition:max-height .3s ease; padding-left:16px; border-left:1px dashed var(--border);}
.dars-list.open{max-height:4000px;}
.dars-item{
  display:flex; align-items:flex-start; gap:8px;
  padding:7px 10px; margin:1px 0; border-radius:6px; cursor:pointer;
  font-size:12px; line-height:1.35; color:var(--text-faint);
  transition:background .12s, color .12s;
}
.dars-item:hover{background:var(--panel-2); color:var(--text);}
.dars-item.active{background:rgba(23,96,45,0.10); color:var(--accent);}
.dars-item.ready::before{content:'●'; color:var(--green); font-size:8px; margin-top:4px;}
.dars-item:not(.ready)::before{content:'○'; color:var(--text-faint); font-size:8px; margin-top:4px;}
.dars-item .dnum{font-family:var(--font-mono); color:var(--text-faint); font-size:10px; flex:0 0 auto;}
main{flex:1; min-width:0; overflow-y:auto; padding:36px 44px 80px;}
.empty-state{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--text-faint); text-align:center; gap:14px; padding-top:10vh;
}
.empty-state .big-icon{font-size:64px; opacity:0.3;}
.empty-state h2{font-family:var(--font-display); font-size:28px; color:var(--text-dim); font-weight:600;}
.empty-state p{max-width:420px; font-size:14px; line-height:1.6;}
.not-ready{
  border:1px dashed var(--border-light); border-radius:12px; padding:50px 30px;
  text-align:center; color:var(--text-faint); margin-top:20px;
}
.not-ready .tag{
  display:inline-block; font-family:var(--font-mono); font-size:11px; letter-spacing:1px;
  color:var(--accent2); border:1px solid var(--accent2-dim); border-radius:20px; padding:4px 14px; margin-bottom:16px;
}
.lesson-header{margin-bottom:28px;}
.badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.type-badge{
  font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
  padding:4px 11px; border-radius:20px; border:1px solid;
}
.type-badge.qurish{color:var(--accent); border-color:var(--accent-dim); background:rgba(23,96,45,0.07);}
.type-badge.nazorat{color:var(--accent2); border-color:var(--accent2-dim); background:rgba(154,100,16,0.07);}
.type-badge.loyiha{color:#6b3fa0; border-color:#c9b3e0; background:rgba(107,63,160,0.07);}
.type-badge.dasturlash{color:#0b6b8f; border-color:#a9d3e4; background:rgba(11,107,143,0.07);}
.type-badge.spike{color:#b04a20; border-color:#e6bda9; background:rgba(176,74,32,0.07);}
.lesson-title{font-family:var(--font-display); font-weight:700; font-size:34px; line-height:1.15; color:var(--text); margin-bottom:6px;}
.lesson-model{font-family:var(--font-mono); font-size:15px; color:var(--accent);}
.meta-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden;
  margin:22px 0 34px;
}
.meta-cell{background:var(--panel); padding:12px 16px;}
.meta-cell .k{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-bottom:4px;}
.meta-cell .v{font-size:13px; color:var(--text); font-weight:500;}
.section{margin-bottom:30px;}
.section-num{
  font-family:var(--font-mono); font-size:11px; color:var(--accent);
  letter-spacing:2px; margin-bottom:6px;
}
.section h2{
  font-family:var(--font-display); font-weight:700; font-size:22px; text-transform:uppercase;
  color:var(--text); border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:16px;
  letter-spacing:0.3px;
}
.section ol, .section ul{padding-left:22px;}
.section li{margin-bottom:9px; font-size:14.5px; line-height:1.6; color:var(--text);}
.section p{font-size:14.5px; line-height:1.7; color:var(--text);}
.subhead{
  font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--accent2);
  margin:18px 0 8px; padding-left:2px;
}
.subhead:first-child{margin-top:0;}
.soft-skill-box{
  background:linear-gradient(135deg, rgba(154,100,16,0.09), rgba(154,100,16,0.03));
  border:1px solid var(--accent2-dim); border-radius:10px; padding:18px 20px;
}
.res-list{list-style:none; padding-left:0;}
.res-item{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:11px 14px; margin-bottom:8px;
  background:var(--panel); border:1px solid var(--border);
  border-radius:9px; transition:border-color .15s, background .15s;
}
.res-item:hover{border-color:var(--accent-dim); background:var(--panel-2);}
.res-link{display:flex; align-items:center; gap:11px; text-decoration:none; flex:1; min-width:0;}
.res-type{
  flex:0 0 auto; font-family:var(--font-mono); font-size:9px; font-weight:600;
  letter-spacing:0.8px; padding:4px 8px; border-radius:4px; border:1px solid;
}
.res-type.pdf{color:#b04a20; border-color:#e6bda9; background:rgba(176,74,32,0.09);}
.res-type.web{color:var(--accent); border-color:var(--accent-dim); background:rgba(23,96,45,0.09);}
.res-type.video{color:#6b3fa0; border-color:#c9b3e0; background:rgba(107,63,160,0.09);}
.res-type.lokal{color:#4a7d1c; border-color:#c2dba0; background:rgba(106,180,45,0.14);}
.res-name{font-size:14px; color:var(--text); line-height:1.4;}
.res-link:hover .res-name{color:var(--accent);}
.res-src{
  font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
  white-space:nowrap; margin-left:auto;
}
/* --- Makerzoid bosqichma-bosqich qurish instruksiyasi (galereya) --- */
.instr{border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--panel); margin-bottom:14px;}
.instr-bar{
  display:flex; align-items:center; gap:12px; padding:9px 14px;
  background:var(--panel-2); border-bottom:1px solid var(--border);
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.8px; text-transform:uppercase;
}
.instr-src{color:var(--text-faint);}
.instr-count{margin-left:auto; color:var(--accent2);}
.instr-stage{background:#fff; display:flex; align-items:center; justify-content:center; padding:6px; min-height:0;}
.instr-stage img{max-width:100%; max-height:62vh; height:auto; display:block; cursor:pointer;}
.instr-nav{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:11px 14px; border-top:1px solid var(--border);
}
.ig-btn{
  font-family:var(--font-mono); font-size:12px; color:var(--text-dim); cursor:pointer;
  background:var(--bg-deep); border:1px solid var(--border-light); border-radius:7px; padding:7px 13px;
  transition:border-color .15s, color .15s;
}
.ig-btn:hover{border-color:var(--accent-dim); color:var(--text);}
.ig-btn.on{background:var(--accent); color:var(--bg-deep); border-color:var(--accent);}
.ig-toggle{margin-left:auto;}
.ig-pos{font-family:var(--font-mono); font-size:13px; color:var(--text-dim);}
.ig-pos b{color:var(--accent); font-size:15px;}
.instr-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:7px;
  padding:12px 14px; border-top:1px solid var(--border); max-height:460px; overflow-y:auto;
}
/* display:grid [hidden] ni bekor qiladi — shuning uchun aniq yashiramiz */
.instr-grid[hidden]{display:none;}
.ig-thumb{
  position:relative; padding:0; cursor:pointer; background:#fff;
  border:1px solid var(--border-light); border-radius:6px; overflow:hidden; line-height:0;
}
.ig-thumb:hover{border-color:var(--accent);}
.ig-thumb img{width:100%; height:auto; display:block;}
.ig-thumb span{
  position:absolute; left:3px; top:3px; font-family:var(--font-mono); font-size:9px;
  background:rgba(18,42,27,0.84); color:#fff; padding:1px 5px; border-radius:3px; line-height:1.4;
}
/* --- Instruksiya galereyasi: to'liq ekran --- */
/* Ikki holat bir xil ko'rinadi:
   :fullscreen   — brauzerning o'z to'liq ekran rejimi (asosiy yo'l)
   .ig-fs        — zaxira rejim (iPhone Safari element uchun fullscreen bermaydi) */
.instr:fullscreen,
.instr.ig-fs{
  display:flex; flex-direction:column;
  border:none; border-radius:0; margin:0;
  background:var(--panel);
}
.instr.ig-fs{position:fixed; inset:0; z-index:1000;}
body.ig-fs-open{overflow:hidden;}   /* orqadagi sahifa aylanmasin */

.instr:fullscreen .instr-stage,
.instr.ig-fs .instr-stage{flex:1; padding:10px;}
/* Oddiy rejimdagi 62vh cheklovi bekor qilinadi — rasm bor bo'shliqni to'liq egallaydi */
.instr:fullscreen .instr-stage img,
.instr.ig-fs .instr-stage img{max-height:100%; max-width:100%; object-fit:contain;}
.instr:fullscreen .instr-grid,
.instr.ig-fs .instr-grid{max-height:26vh;}
.instr:fullscreen .instr-bar,
.instr.ig-fs .instr-bar,
.instr:fullscreen .instr-nav,
.instr.ig-fs .instr-nav{flex:0 0 auto;}

/* --- Missiya darslari: dars topshirig'i va ball jadvali --- */
.task-box{
  background:linear-gradient(135deg, rgba(23,96,45,0.08), rgba(23,96,45,0.025));
  border:1px solid var(--accent-dim); border-radius:10px; padding:18px 20px; margin-bottom:22px;
}
.task-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.task-code{
  font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:0.5px;
  color:var(--bg-deep); background:var(--accent); padding:4px 11px; border-radius:5px;
}
.task-title{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--text); letter-spacing:0.3px;}
.task-list{padding-left:20px; margin-bottom:14px;}
.task-list li{margin-bottom:8px; font-size:14.5px; line-height:1.6;}
.task-mezon{
  font-size:13.5px; line-height:1.6; color:var(--text-dim);
  border-top:1px dashed var(--border-light); padding-top:12px;
}
.task-mezon b{color:var(--accent);}   /* --green faqat belgi/nuqta uchun — matnda kontrasti past */
.score-table{
  width:100%; border-collapse:collapse; font-size:14px;
  border:1px solid var(--border); border-radius:9px; overflow:hidden;
}
.score-table th{
  background:var(--panel-2); text-align:left; padding:9px 13px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
  color:var(--text-faint); font-weight:600;
}
.score-table td{padding:10px 13px; border-top:1px solid var(--border); line-height:1.5; background:var(--panel);}
.score-table .tk{font-family:var(--font-mono); color:var(--accent); white-space:nowrap; width:1%;}
.score-table .tb{font-family:var(--font-mono); color:var(--accent2); text-align:right; white-space:nowrap; width:1%; font-weight:600;}
.score-table tfoot td{background:var(--panel-2); font-weight:600; color:var(--text);}
/* --- Musobaqa maydonchasi chizmasi --- */
.field-wrap{
  border:1px solid var(--border); border-radius:10px; overflow-x:auto; background:var(--bg-deep);
  padding:10px;
}
.field-wrap svg{display:block; width:100%; min-width:520px; height:auto;}
.field-note{margin-top:12px; font-size:13.5px; color:var(--text-dim); line-height:1.65;}
/* Faqat telefonda ko'rinadi — chizma ekranga sig'masa surish kerakligini bildiradi */
.scroll-hint{
  display:none; margin-top:7px; text-align:center;
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:0.5px;
}
footer{
  text-align:center; padding:20px; font-family:var(--font-mono); font-size:11px;
  color:var(--text-faint); border-top:1px solid var(--border);
}
/* Ishlab chiquvchi va bog'lanish — asosiy qatordan pastda, biroz xiraroq */
.foot-dev{margin-top:6px; font-size:10.5px; letter-spacing:0.3px;}
.foot-dev a{color:var(--accent); text-decoration:none;}
.foot-dev a:hover{text-decoration:underline;}
/* ================= PLANSHET va TELEFON ================= */
@media (max-width: 860px){
  .nav-toggle{display:flex;}
  header{gap:12px; padding:10px 14px;}
  h1.brand{font-size:18px;}
  .brand-sub{display:none;}
  .stats-badge{order:2; margin-left:auto; font-size:10px; padding:5px 10px;}
  /* Qidiruv maydoni ikkinchi qatorga to'liq kenglikda tushadi */
  .search-wrap{order:5; width:100%; max-width:none; margin-left:0; flex:1 0 100%;}
  .search-wrap input{padding:9px 12px 9px 34px; font-size:16px;} /* 16px — iOS avtomatik kattalashtirmasligi uchun */

  .layout{position:relative;}
  /* Darslar ro'yxati — chetdan chiqadigan panel */
  nav.tree{
    position:fixed; left:0; top:var(--hdr); bottom:0; width:min(86vw, 340px); z-index:100;
    transform:translateX(-102%); transition:transform .25s ease;
    background:var(--bg); box-shadow:10px 0 40px rgba(22,38,27,0.22);
    padding-top:14px;
  }
  nav.tree.mobile-open{transform:translateX(0);}
  .nav-backdrop{
    display:block; position:fixed; left:0; right:0; bottom:0; top:var(--hdr); z-index:90;
    background:rgba(22,38,27,0.44); opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .nav-backdrop.on{opacity:1; pointer-events:auto;}

  main{padding:22px 16px 60px;}
  .lesson-title{font-size:26px;}
  .lesson-model{font-size:14px;}
  .meta-grid{grid-template-columns:1fr 1fr; margin:18px 0 26px;}
  .meta-cell{padding:10px 12px;}
  .section{margin-bottom:26px;}
  .section h2{font-size:19px;}
  .section li, .section p{font-size:14px;}
  .section ol, .section ul{padding-left:19px;}
  .empty-state{padding-top:6vh;}
  .open-nav-btn{
    display:inline-block; margin-top:8px; cursor:pointer;
    font-family:var(--font-mono); font-size:13px; color:var(--bg-deep);
    background:var(--accent); border:none; border-radius:8px; padding:11px 20px;
  }
  /* Topshiriq va ball jadvali */
  .task-box{padding:15px 15px;}
  .task-title{font-size:17px;}
  /* Ball ustuni ekrandan chiqib ketmasligi kerak — matn o'rniga ko'chsin */
  .score-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .score-table{min-width:0; font-size:13px;}
  .score-table th, .score-table td{padding:9px 8px;}
  /* Maydoncha chizmasi — o'z ichida gorizontal suriladi */
  .field-wrap{padding:6px;}
  .field-wrap svg{min-width:460px;}
  .scroll-hint{display:block;}
  /* Instruksiya galereyasi */
  .instr-stage img{max-height:52vh;}
  .instr-nav{gap:8px; padding:10px;}
  .ig-btn{padding:10px 12px; font-size:12px;}
  .ig-toggle{margin-left:0; flex:1 0 100%; text-align:center;}
  .ig-full{flex:1 0 100%; text-align:center;}
  .instr-grid{grid-template-columns:repeat(auto-fill, minmax(72px,1fr)); max-height:340px; padding:10px;}
  .res-item{padding:10px 12px; gap:9px;}
  .res-name{font-size:13px;}
  .res-src{margin-left:0; flex:1 0 100%;}
  footer{font-size:10px; padding:16px 12px; line-height:1.7;}
}

/* ================= KICHIK TELEFON ================= */
@media (max-width: 480px){
  .stats-badge{font-size:9px; padding:4px 9px;}
  h1.brand{font-size:16px;}
  /* Juda tor ekranda hisoblagich alohida qator egallamasin */
  @media (max-width: 400px){ .stats-badge{display:none;} }
  main{padding:18px 13px 50px;}
  .lesson-title{font-size:22px;}
  .section h2{font-size:17px;}
  .subhead{font-size:12px;}
  .soft-skill-box{padding:14px 15px;}
  .instr-grid{grid-template-columns:repeat(auto-fill, minmax(62px,1fr));}
  .dars-item{font-size:12.5px; padding:9px 10px;}   /* barmoq bilan bosish qulay bo'lishi uchun */
  .chorak-head{padding:10px;}
  .sinf-head{padding:12px;}
}

/* Sensorli ekranda hover effektlari "yopishib" qolmasligi uchun */
@media (hover: none){
  .dars-item:hover{background:none; color:var(--text-faint);}
  .dars-item.active{background:rgba(23,96,45,0.10); color:var(--accent);}
  .res-item:hover{border-color:var(--border); background:var(--panel);}
}
</style>
</head>

        <path d="M16 13.2Q20.8 11.4 19.6 5.6Q15.2 7.8 16 13.2Z"/>

        <path d="M15.2 22.8Q10.4 20.2 5.4 20.6V27.2Q10.4 26.8 15.2 29.4Z"/>

  <div class="brand-wrap">

<div class="layout">

      <button class="open-nav-btn" type="button" onclick="setNav(true)">Darslar ro'yxatini ochish</button>
    </div>
  </main>
</div>

<footer>

  <div class="foot-dev">EcoDev · <a href="tel:+998993757532">+998 99 375 75 32</a></div>
